[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rabr"
version = "0.1.0"
description = "Risk-adaptive bundle recommendation experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
models = ["torch>=2.4,<3", "transformers>=4.44,<5", "accelerate>=0.33,<2"]
diffusion = ["faiss-cpu>=1.8,<2"]
distillation = ["peft>=0.12,<1"]
quantization = ["bitsandbytes>=0.43,<1; platform_system == 'Linux'"]

[project.scripts]
rabr-run = "rabr.run:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md", "licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]
